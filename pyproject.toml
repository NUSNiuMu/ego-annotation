[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-annotation"
version = "0.1.0"
description = "Local MCAP sampling, Qwen annotation and evidence-bound GPT skill review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcap==1.4.0", "av==16.0.1", "Pillow>=9.0.1", "lz4>=3.1.3", "zstandard==0.25.0"]

[project.optional-dependencies]
inference = ["torch==2.8.0", "transformers==5.19.0", "accelerate>=1.0"]

[project.scripts]
ego-annotate = "ego_annotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ego_annotation.inference" = ["model_identity.json"]
